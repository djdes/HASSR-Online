<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Сборная холодильная камера с Wi-Fi датчиком у двери">
  <!-- Фон главы «Датчики»: подсобка со сборной холодильной камерой из белых
       сэндвич-панелей (металлические уголки, дверь с ручкой-защёлкой,
       моноблок сверху) и Wi-Fi датчик на панели у двери. Рисунок WeSetup,
       без чужих логотипов; сцена затемняет его, как фото других глав. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58627a"/>
      <stop offset="1" stop-color="#434b61"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#363d50"/>
      <stop offset="1" stop-color="#252b3b"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.62" cy="0" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8fb"/>
      <stop offset="1" stop-color="#e2e7ee"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d5dbe4"/>
      <stop offset="1" stop-color="#bcc4d0"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcfd"/>
      <stop offset="1" stop-color="#eef1f5"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c7ced8"/>
      <stop offset="0.5" stop-color="#a3adbb"/>
      <stop offset="1" stop-color="#8d97a6"/>
    </linearGradient>
    <linearGradient id="metalH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfd5de"/>
      <stop offset="1" stop-color="#97a1b0"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1f4f8"/>
      <stop offset="1" stop-color="#e3e8ef"/>
    </linearGradient>
    <linearGradient id="unit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1f5"/>
      <stop offset="1" stop-color="#d4dae3"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0b1024" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#0b1024" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Подсобка: стена, плинтус, пол, свет сверху -->
  <rect width="1600" height="760" fill="url(#wall)"/>
  <rect y="728" width="1600" height="32" fill="#353c4f"/>
  <rect y="760" width="1600" height="240" fill="url(#floor)"/>
  <g stroke="#2e3446" stroke-width="3" opacity="0.7">
    <path d="M0 830 H1600 M0 910 H1600"/>
    <path d="M300 760 L180 1000 M640 760 L600 1000 M980 760 L1020 1000 M1320 760 L1440 1000"/>
  </g>
  <rect width="1600" height="1000" fill="url(#lamp)"/>

  <!-- Стеллаж с ящиками у левой стены -->
  <g opacity="0.85">
    <g fill="#7d879b">
      <rect x="110" y="300" width="14" height="460"/>
      <rect x="506" y="300" width="14" height="460"/>
    </g>
    <g fill="#8e98ab">
      <rect x="110" y="380" width="410" height="12"/>
      <rect x="110" y="520" width="410" height="12"/>
      <rect x="110" y="660" width="410" height="12"/>
    </g>
    <g>
      <rect x="140" y="318" width="120" height="62" rx="6" fill="#6f86c9"/>
      <rect x="276" y="330" width="96" height="50" rx="6" fill="#9aa6bd"/>
      <rect x="388" y="312" width="104" height="68" rx="6" fill="#5f9f8d"/>
      <rect x="150" y="452" width="140" height="68" rx="6" fill="#a7b0c2"/>
      <rect x="306" y="466" width="90" height="54" rx="6" fill="#7b70c4"/>
      <rect x="410" y="458" width="84" height="62" rx="6" fill="#8a96ad"/>
      <rect x="136" y="600" width="110" height="60" rx="6" fill="#9b8f78"/>
      <rect x="262" y="590" width="150" height="70" rx="6" fill="#7f8ca6"/>
      <rect x="426" y="606" width="70" height="54" rx="6" fill="#6f86c9"/>
    </g>
  </g>

  <!-- Тень камеры на полу -->
  <ellipse cx="1190" cy="806" rx="440" ry="46" fill="url(#shadow)"/>

  <!-- Холодильная камера: крыша, бок, фасад -->
  <polygon points="860,236 1010,176 1530,176 1380,236" fill="url(#top)"/>
  <polygon points="1380,236 1530,176 1530,736 1380,800" fill="url(#side)"/>
  <rect x="860" y="236" width="520" height="564" fill="url(#front)"/>

  <!-- Швы сэндвич-панелей -->
  <g stroke="#c9d0da" stroke-width="3">
    <path d="M990 236 V800 M1250 236 V800"/>
    <path d="M1430 216 V779 M1480 196 V757"/>
  </g>

  <!-- Дверь: рама, полотно, уплотнитель, петли, ручка-защёлка -->
  <rect x="1010" y="300" width="226" height="500" fill="#b3bcc9"/>
  <rect x="1022" y="312" width="202" height="488" fill="url(#door)"/>
  <rect x="1022" y="312" width="202" height="488" fill="none" stroke="#d0d7e1" stroke-width="4"/>
  <g fill="#8e98a8">
    <rect x="1016" y="360" width="10" height="44" rx="3"/>
    <rect x="1016" y="690" width="10" height="44" rx="3"/>
  </g>
  <rect x="1046" y="340" width="74" height="26" rx="5" fill="#5566f6" opacity="0.85"/>
  <g>
    <rect x="1186" y="508" width="24" height="86" rx="7" fill="#2b3241"/>
    <rect x="1150" y="530" width="48" height="14" rx="7" fill="#394152"/>
    <circle cx="1198" cy="572" r="5" fill="#9aa4b3"/>
  </g>

  <!-- Металлические уголки по рёбрам -->
  <rect x="852" y="228" width="18" height="580" fill="url(#metal)"/>
  <rect x="1372" y="228" width="18" height="580" fill="url(#metal)"/>
  <rect x="852" y="228" width="538" height="16" fill="url(#metalH)"/>
  <rect x="852" y="792" width="538" height="14" fill="url(#metalH)"/>
  <polygon points="1372,236 1522,176 1538,176 1390,244" fill="#b9c1cc"/>
  <rect x="1522" y="172" width="16" height="568" fill="url(#metal)"/>
  <polygon points="852,236 1002,176 1018,176 870,244" fill="#c3cad4"/>

  <!-- Моноблок на крыше: корпус, решётка -->
  <polygon points="980,120 1030,100 1250,100 1200,120" fill="#f4f6f9"/>
  <polygon points="1200,120 1250,100 1250,190 1200,212" fill="#c4cbd5"/>
  <rect x="980" y="120" width="220" height="92" fill="url(#unit)"/>
  <g stroke="#9ea7b5" stroke-width="5" stroke-linecap="round">
    <path d="M1000 140 H1180 M1000 156 H1180 M1000 172 H1180 M1000 188 H1180"/>
  </g>
  <circle cx="1225" cy="156" r="20" fill="none" stroke="#9ea7b5" stroke-width="4"/>

  <!-- Wi-Fi датчик на панели у двери -->
  <g>
    <rect x="1270" y="452" width="78" height="92" rx="12" fill="#ffffff" stroke="#c6cdd8" stroke-width="3"/>
    <rect x="1282" y="466" width="54" height="40" rx="6" fill="#1d3a2a"/>
    <rect x="1290" y="478" width="38" height="16" rx="3" fill="#7cf5c0" opacity="0.95"/>
    <circle cx="1309" cy="524" r="7" fill="#7cf5c0"/>
    <circle cx="1309" cy="524" r="16" fill="#7cf5c0" opacity="0.55" filter="url(#glow)"/>
    <g fill="none" stroke="#8b97ff" stroke-width="5" stroke-linecap="round">
      <path d="M1288 432 a30 30 0 0 1 42 0"/>
      <path d="M1276 418 a48 48 0 0 1 66 0"/>
    </g>
  </g>
</svg>
