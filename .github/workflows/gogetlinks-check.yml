name: GoGetLinks checks

on:
  pull_request:
    paths:
      - "src/lib/seo/gogetlinks-*"
      - "src/components/root/seo-links/**"
      - "src/app/api/root/gogetlinks/**"
      - "src/app/root/seo/links/**"
      - "config/api-anything/sites/gogetlinks.json"
      - "dispatcher/wesetup-worker*"
      - "dispatcher/ggl-webmasters-payload.mjs"
      - ".github/workflows/gogetlinks-check.yml"

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, tests and Ralph routing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:1/wesetup_test
      TEST_CONCURRENCY: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run test:gate
      - name: Ralph queue routing without external calls
        shell: pwsh
        run: ./dispatcher/wesetup-worker.test.ps1
