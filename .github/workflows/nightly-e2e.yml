name: Nightly e2e (directory exchange)

# Ночной прогон сквозных сценариев (серия D, Р3): обмен справочниками, фон и
# закрытые организации, напоминания, разбор пропусков, баланс и перевод,
# инструменты ROOT, отмена переноса, код кабинета, компании, меню и сырьё,
# версии отпечатка и новые списки — `scripts/e2e/` (`npm run e2e:exchange`),
# без браузера. Каждый сценарий сам заводит свои организации и убирает их.
#
# База — одноразовый PostgreSQL этого запуска (service container): на прод
# ничего не пишется, секретов прода здесь нет. Почта без SMTP только пишется
# в лог. Сбой ночного прогона — сообщение в Telegram тем же ботом и в тот же
# чат, что сбой выката (job notify-failure, как в deploy.yml).
#
# Серия E (Р2): те же сценарии идут и на pull request в master, если он
# меняет обмен, балансы, свои 14 дней организации, оплату, роли аккаунта и
# сеть, API настроек, сами сценарии, схему базы или этот файл. Сбой на PR
# виден в проверках PR — в Telegram о нём не пишем (только ночной запуск).
on:
  schedule:
    # 01:17 UTC = 04:17 МСК — ночью и не в начале часа.
    - cron: "17 1 * * *"
  workflow_dispatch: {}
  pull_request:
    branches: [master]
    paths:
      - "src/lib/directory-exchange/**"
      - "src/lib/balance/**"
      - "src/lib/org-trial*"
      - "src/lib/billing.server.ts"
      - "src/lib/account-roles*"
      - "src/lib/network-*"
      - "src/app/api/settings/**"
      - "scripts/e2e/**"
      # Смоук новинок 21.11.2026 (scripts/e2e/new-features-check.ts).
      - "src/lib/supply/**"
      - "src/lib/acceptance-sources*"
      - "src/lib/mercury/**"
      - "src/lib/name-suggestions*"
      - "src/lib/cms-signature*"
      - "src/lib/ukep-*"
      - "src/app/api/journal-documents/**/ukep/**"
      # Смоук в браузере (scripts/smoke/new-features.smoke.cjs): экраны новинок.
      - "scripts/smoke/**"
      - "src/components/journals/acceptance-document-client.tsx"
      - "src/components/journals/ukep-sign-dialog.tsx"
      - "src/components/journals/document-actions-bar.tsx"
      - "src/components/settings/onboarding-template-client.tsx"
      - "src/app/(dashboard)/settings/integrations/poster/**"
      - "src/app/(dashboard)/journals/traceability/**"
      - "src/app/(dashboard)/mercury/**"
      - "prisma/schema.prisma"
      - ".github/workflows/nightly-e2e.yml"

permissions:
  contents: read

concurrency:
  # Ночной и ручной прогоны — по одному; на PR новый пуш отменяет прежний прогон этого PR.
  group: nightly-e2e-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: E2E scenarios (DB level)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: haccp_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d haccp_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/haccp_e2e?sslmode=disable
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@localhost:5432/haccp_e2e?sslmode=disable
      NEXTAUTH_SECRET: nightly-e2e-dummy-secret
      NEXTAUTH_URL: http://localhost:3000
      CRON_SECRET: nightly-e2e-dummy-cron-secret
      PLATFORM_ORG_ID: platform
      # Пустой SMTP: письма не уходят, а пишутся в лог.
      SMTP_HOST: ""
      # Бота нет: сообщения Telegram сценариев только пишутся как неотправленные.
      TELEGRAM_BOT_TOKEN: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          # Как в deploy.yml: кеш npm отключён — он занимает ~280 МБ хранилища
          # Actions на ключ, а оно тарифицируется; ночному прогону лишние
          # 20–60 секунд установки не важны.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create the schema in the throwaway database
        run: npx prisma db push

      - name: Seed journal templates
        run: npx tsx prisma/seed.ts

      - name: Run e2e scenarios
        run: npm run e2e:exchange

  # Смоук новинок в браузере (iPhone 13): вход руководителя, мастер настройки, журнал приёмки с
  # Меркурием и iiko, подпись УКЭП целиком (подставной плагин + openssl), «Входящие ВСД», история
  # партии, Poster. Своя одноразовая база, приложение — `next dev`.
  browser-smoke:
    name: Browser smoke (new features)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: haccp_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d haccp_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/haccp_smoke?sslmode=disable
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@localhost:5432/haccp_smoke?sslmode=disable
      NEXTAUTH_SECRET: browser-smoke-dummy-secret-0123456789
      NEXTAUTH_URL: http://localhost:3005
      INTEGRATION_KEY_SECRET: browser-smoke-dummy-integration-key-0123456789
      CRON_SECRET: browser-smoke-dummy-cron-secret
      PLATFORM_ORG_ID: platform
      SMTP_HOST: ""
      TELEGRAM_BOT_TOKEN: ""
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Prepare the throwaway database
        run: |
          npx prisma generate
          npx prisma db push
          npx tsx prisma/seed.ts

      - name: Start the app
        run: |
          (npx next dev -p 3005 > dev.log 2>&1 &)
          for i in $(seq 1 120); do
            if curl -s -o /dev/null -w "%{http_code}" -m 60 http://localhost:3005/login | grep -q 200; then exit 0; fi
            sleep 5
          done
          echo "the app did not start"; tail -50 dev.log; exit 1

      - name: Smoke data
        run: echo "SMOKE_DATA=$(npx tsx scripts/smoke/new-features-setup.ts | tail -1)" >> "$GITHUB_ENV"

      - name: Browser smoke
        run: node scripts/smoke/new-features.smoke.cjs smoke-shots

      - name: App log on failure
        if: failure()
        run: tail -80 dev.log || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-smoke-screenshots
          path: smoke-shots
          retention-days: 7

  notify-failure:
    name: Notify Telegram on failure
    needs: [e2e, browser-smoke]
    # Только ночной запуск; cancelled — в том числе превышение timeout-minutes.
    if: always() && github.event_name == 'schedule' && (needs.e2e.result == 'failure' || needs.e2e.result == 'cancelled' || needs.browser-smoke.result == 'failure' || needs.browser-smoke.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Notify Telegram on failure
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.DEPLOY_ALERT_TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHORT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "[notify] секреты не заданы — пропуск"
            exit 0
          fi
          if [ "$E2E_RESULT" = "cancelled" ]; then
            WHAT="прерваны (время вышло или отмена)"
          else
            WHAT="упали"
          fi
          TEXT=$(printf '❌ Ночные сквозные проверки wesetup.ru %s\nВетка %s, коммит %s\nНа прод не влияет: прогон на одноразовой базе.\nЛог: %s' "$WHAT" "$REF_NAME" "${SHORT_SHA:0:8}" "$RUN_URL")
          curl -sS --max-time 20 -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true" \
            -o /dev/null -w "[notify] telegram HTTP %{http_code}\n" || echo "[notify] не отправилось — non-fatal"
