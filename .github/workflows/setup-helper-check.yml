# «Сетап помощник» (mobile/setup-helper): unit-тесты ядра и экранов
# (Robolectric) и отладочный APK в артефактах. Без секретов, ничего не
# выкатывает. Отдельно от «Проверки приложений»: там есть дорогое задание
# macOS, а этому приложению iOS-сборка не нужна.
name: Сетап помощник — проверка

on:
  push:
    branches: [master]
    paths:
      - "mobile/setup-helper/**"
      - ".github/workflows/setup-helper-check.yml"
  pull_request:
    paths:
      - "mobile/setup-helper/**"
      - ".github/workflows/setup-helper-check.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Выпуск: подписанный APK и version.json для resources/setup-helper"
        type: boolean
        default: false

concurrency:
  group: setup-helper-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Тесты и APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile/setup-helper
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            mobile/setup-helper/**/*.gradle
            mobile/setup-helper/gradle/wrapper/gradle-wrapper.properties

      - name: Тесты
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:testDebugUnitTest --no-daemon

      - name: Сборка APK
        env:
          # Ключ выпуска — из секретов. В pull request из чужого форка их нет:
          # тогда release подписывается отладочным ключом (только для проверки).
          SETUP_HELPER_KEYSTORE_BASE64: ${{ secrets.SETUP_HELPER_KEYSTORE_BASE64 }}
          SETUP_HELPER_KEYSTORE_PASSWORD: ${{ secrets.SETUP_HELPER_KEYSTORE_PASSWORD }}
          SETUP_HELPER_KEY_ALIAS: ${{ secrets.SETUP_HELPER_KEY_ALIAS }}
          SETUP_HELPER_KEY_PASSWORD: ${{ secrets.SETUP_HELPER_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      # Выпуск по кнопке (workflow_dispatch, publish=true): publishRelease
      # сверяет подпись и номер сборки и пишет APK + version.json; их коммитят
      # в resources/setup-helper — после деплоя телефоны обновятся сами.
      - name: Выпуск (publishRelease)
        if: ${{ inputs.publish }}
        env:
          SETUP_HELPER_KEYSTORE_BASE64: ${{ secrets.SETUP_HELPER_KEYSTORE_BASE64 }}
          SETUP_HELPER_KEYSTORE_PASSWORD: ${{ secrets.SETUP_HELPER_KEYSTORE_PASSWORD }}
          SETUP_HELPER_KEY_ALIAS: ${{ secrets.SETUP_HELPER_KEY_ALIAS }}
          SETUP_HELPER_KEY_PASSWORD: ${{ secrets.SETUP_HELPER_KEY_PASSWORD }}
        run: ./gradlew publishRelease --no-daemon

      - uses: actions/upload-artifact@v7
        if: ${{ inputs.publish }}
        with:
          name: setup-helper-publish-${{ github.run_number }}
          path: resources/setup-helper/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v7
        with:
          name: setup-helper-debug-apk-${{ github.run_number }}
          path: mobile/setup-helper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Release-сборка (сжатая, как на сайте), подписана ключом выпуска.
      - uses: actions/upload-artifact@v7
        with:
          name: setup-helper-release-apk-${{ github.run_number }}
          path: mobile/setup-helper/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      # Превью этикеток из тестов: что напечатает принтер.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: setup-helper-label-previews-${{ github.run_number }}
          path: |
            mobile/setup-helper/core/build/label-previews/
            mobile/setup-helper/app/build/android-label-previews/
          if-no-files-found: warn
          retention-days: 14
