name: Deploy to production

on:
  push:
    branches: [master]
  # Fallback trigger — run the same workflow manually from the Actions
  # UI when the `push` hook silently doesn't fire (e.g. GitHub Actions
  # minutes exhausted, workflow auto-paused after inactivity, or runner
  # outage). Use "Run workflow" on the Deploy to production page.
  workflow_dispatch: {}

# Serialize prod-deploys. Без этого блока два push'а в master запускали
# два workflow-run'а в параллель, и оба пытались `pm2 delete haccp-online`
# + `pm2 start` одновременно — race на бинарнике + .next/. Иногда прод
# оставался без процесса.
#
# cancel-in-progress: false — каждый run докатывается до конца. Свежий
# push становится pending; повторные push'и вытесняют его в очереди
# (последний выигрывает), но активный run не убивается до pm2 reload.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  APP_DIR: /var/www/wesetupru/data/www/wesetup.ru/app
  # Must be >= 22 — undici@8 requires Node 20.18+, and the prod server
  # runs Node 22. Keep the CI and prod runtimes aligned to avoid
  # "engines" mismatches during npm ci.
  NODE_VERSION: "22"

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 45, а не 30: три SSH-шага в сумме просят до 55 минут в худшем
    # случае (чистая установка зависимостей + сборка + миграции), и
    # бюджета в 30 не хватало — job убивался раньше своих же шагов.
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Кеш npm намеренно ОТКЛЮЧЁН. Он экономил ~20 секунд на шаге
          # установки зависимостей, а занимал 283 МБ на каждый ключ — за
          # три прогона накопилось 848 МБ, и хранилище Actions
          # тарифицируется даже у публичных репозиториев. Сборка всё
          # равно идёт на сервере, эти 20 секунд не решают ничего.

      - name: Install dependencies
        run: npm ci

      - name: Prepare CI env for build
        run: |
          if [ -n "${{ secrets.DATABASE_URL }}" ]; then
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
          else
            echo "DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/postgres" >> .env
          fi

      - name: Generate Prisma client for CI build
        run: npx prisma generate

      # CI gate: type-check + tests (baseline-aware). Любая НОВАЯ регрессия
      # в тестах блокирует deploy. Легаси fails из tests/.legacy-failures.txt
      # разрешены — это рабочие точки для постепенного устранения.
      # См. docs/superpowers/specs/01-architecture.md.
      - name: Type-check
        # Проект перерос стандартные ~2 ГБ кучи Node: tsc падал с
        # «JavaScript heap out of memory» (2026-09-22). У раннера 7 ГБ.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run typecheck

      - name: Tests (baseline gate)
        run: npm run test:gate

      - name: Write build-time only (sha записывается на проде до build)
        run: |
          # КРИТИЧНО: .build-sha НЕ пишем тут. Если запишем — он попадёт
          # в tar и при failed build на проде /api/health показывал бы
          # «свежий» sha притом что новый код не задеплоен.
          # Sha пишем НА ПРОДЕ перед `npm run build` — next.config.ts
          # читает его в getBuildId() и запекает в NEXT_PUBLIC_BUILD_ID.
          # Если build/verify упадёт — PM2 не рестартует, старый процесс
          # с старым запечённым sha продолжает жить.
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .build-time

      - name: Create deploy tarball
        run: |
          # ВАЖНО: `--exclude=journals` (без `./`) матчится любой папкой
          # `journals` в дереве, в т.ч. `src/app/(dashboard)/journals/`,
          # `src/app/api/journals/`, `src/app/mini/journals/` — после
          # extract на проде пропадали все роуты журналов и сайт отдавал
          # «Страница не найдена». Ставим `./journals` чтобы анкорить на
          # корень репо — исключаются только source-данные, не код.
          tar cf deploy.tar \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=public/screenshots \
            --exclude=.git \
            --exclude=.github \
            --exclude=.claude \
            --exclude=.vscode \
            --exclude=.agent \
            --exclude=./journals \
            --exclude=./tmp-source-journals \
            --exclude=_run.py \
            --exclude=_deploy.py \
            --exclude=_seed_remote.py \
            --exclude=haccp-deploy.tar \
            --exclude='*.tar' \
            --exclude='*.tar.gz' \
            --exclude='./prod-*.png' \
            --exclude='./animations*.png' \
            --exclude='./screenshot-*.png' \
            --exclude=test.txt \
            --exclude=cloudflared.exe \
            --exclude=pg.zip \
            --exclude=./pgdata \
            --exclude=./docs \
            --exclude='*.exe' \
            --exclude='*.zip' \
            .

      - name: Report tarball size
        run: echo "deploy.tar — $(du -h deploy.tar | cut -f1)"

      - name: Prepare app directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          password: ${{ secrets.DEPLOY_SSH_PASS }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          script: |
            mkdir -p ${{ env.APP_DIR }}
            # Backup .env if it exists
            [ -f ${{ env.APP_DIR }}/.env ] && cp ${{ env.APP_DIR }}/.env ${{ env.APP_DIR }}/.env.bak || true

      - name: Upload tarball via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          password: ${{ secrets.DEPLOY_SSH_PASS }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          source: deploy.tar
          target: ${{ env.APP_DIR }}

      # Deploy разбит на ТРИ SSH-шага: setup / build / seed+restart.
      # Раньше всё было одним ssh-action'ом и при медленном/нестабильном
      # GitHub-runner→prod SSH-туннеле билд (~3 мин) или test-bot-wizard
      # (~2 мин) ловил SIGHUP/timeout посередине. Симптом: .next/server/app
      # частично собран без `(dashboard)/dashboard/page.js`, pm2 не
      # рестартится, прод крутит старый код. Каждый шаг получает свежую
      # SSH-сессию + свой timeout-budget.

      - name: Deploy step 1/3 — setup (extract + npm ci + prisma)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          password: ${{ secrets.DEPLOY_SSH_PASS }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          envs: GITHUB_SHA
          timeout: 1200s
          # 20m, а не 10m. Когда меняется package-lock, шаг сносит
          # node_modules и ставит зависимости начисто — на этом сервере
          # это дольше десяти минут. Деплой с новой библиотекой падал
          # ровно здесь: SSH обрывался посреди `npm ci`, шаги сборки и
          # рестарта не выполнялись, а кабинет оставался без стилей,
          # потому что старая статика к тому моменту уже отложена в
          # сторону. Обычный деплой (lock не менялся) укладывается в
          # полминуты, так что запас ничего не стоит.
          command_timeout: 20m
          script: |
            set -eo pipefail
            cd ${{ env.APP_DIR }}
            export GITHUB_SHA="${{ github.sha }}"

            echo "=== Rescuing user uploads before the wipe ==="
            # public/uploads — файлы, загруженные ЛЮДЬМИ: фото в журналах
            # (доказательство на проверке), вложения обращений и отзывов.
            # В репозитории их нет, они появляются в рантайме — и
            # `rm -rf public` ниже уничтожал их на КАЖДОМ деплое.
            # Обнаружено 2026-09-09: каталог на проде был пуст, а страница
            # отзыва ссылалась на снимок, которого больше не существует.
            #
            # Держим файлы ВНЕ сносимого дерева и подставляем симлинком
            # после распаковки. Симлинк, а не копирование обратно: при
            # падении деплоя между шагами файлы остаются на месте.
            UPLOADS_STORE=/var/www/wesetupru/data/uploads
            mkdir -p "$UPLOADS_STORE"
            if [ -d public/uploads ] && [ ! -L public/uploads ]; then
              # Первый деплой после этой правки: спасаем то, что уцелело.
              cp -an public/uploads/. "$UPLOADS_STORE"/ 2>/dev/null || true
            fi

            echo "=== Cleaning stale source (keeps .env, node_modules, tarball) ==="
            # Source dirs below are fully owned by the repo — nuke them before
            # extraction so renamed/deleted files (e.g. src/app/(mini) moved
            # to src/app/mini) don't leave orphans that collide with the new
            # tree and break Next.js route resolution.
            rm -rf src scripts prisma public .github docs .agent journals tmp-source-journals

            echo "=== Extracting tarball ==="
            tar xf deploy.tar && rm deploy.tar

            echo "=== Re-linking user uploads ==="
            mkdir -p public
            ln -sfn "$UPLOADS_STORE" public/uploads
            ls -ld public/uploads
            # Restore .env from backup if it exists
            [ -f .env.bak ] && cp .env.bak .env || true

            echo "=== Backup OLD .next/static (chunks survive deploy window) ==="
            # R40 fix: PM2 продолжает обслуживать СТАРЫЙ HTML до конца
            # деплоя (его restart — последний шаг).
            #
            # 2026-09-09: раньше здесь `.next/static` УНОСИЛСЯ в бэкап, а
            # ниже шёл `rm -rf .next` — то есть живой сайт оставался без
            # статики с этого момента и до перезапуска в шаге 3. Поймано
            # вживую: `/journals` падал с ChunkLoadError, пять чанков
            # отдавали 500. Теперь работающая сборка НЕ ТРОГАЕТСЯ вовсе:
            # новая собирается в отдельный каталог (шаг 2), и каталоги
            # меняются местами непосредственно перед рестартом (шаг 3).
            echo "=== Кеш сборки для инкрементальной пересборки ==="
            # Копируем, а не переносим: `.next/cache` должен остаться у
            # работающей сборки. Стоит немного места и одну операцию —
            # против минут неработающего сайта.
            rm -rf .next.cache-backup 2>/dev/null || true
            if [ -d .next/cache ]; then
              cp -r .next/cache .next.cache-backup
              echo "[cache] скопирован ($(du -sh .next.cache-backup | cut -f1))"
            else
              echo "[cache] отсутствует — следующая сборка холодная"
            fi

            # Мусор от прошлых деплоев: незавершённая сборка и уже
            # ненужная предыдущая версия.
            rm -rf .next-build .next-previous 2>/dev/null || true

            echo "=== Installing server dependencies (clean) ==="
            # Remove stale node_modules + CI-produced .next to prevent
            # "Cannot find module 'next/dist/compiled/cookie'" desync after
            # npm ci replaces packages referenced by the bundled CI build.
            [ -s ~/.nvm/nvm.sh ] && . ~/.nvm/nvm.sh || true
            # `.next` здесь НЕ трогаем: из него прямо сейчас работает
            # сайт. Новая сборка уезжает в `.next-build` (шаг 2).

            # Зависимости переустанавливаем, только если менялся
            # package-lock. Раньше node_modules сносились и ставились
            # заново КАЖДЫЙ деплой — минута работы ради случая, который
            # наступает раз в несколько дней. Отпечаток лежит рядом и
            # сверяется: не совпал или отсутствует — ставим начисто.
            LOCK_STAMP=".npm-lock-installed"
            if [ -d node_modules ] && cmp -s package-lock.json "$LOCK_STAMP"; then
              echo "[npm] package-lock не менялся — переустановка не нужна"
            else
              echo "[npm] package-lock изменился (или первый деплой) — ставим начисто"
              rm -rf node_modules node_modules/.cache 2>/dev/null || true
              sleep 1
              rm -rf node_modules 2>/dev/null || true
              npm ci --no-audit --no-fund 2>&1 | tail -5 || (
                echo "npm ci failed, retrying after deeper clean" &&                 rm -rf node_modules ~/.npm/_cacache &&                 npm ci --no-audit --no-fund 2>&1 | tail -5
              )
              cp package-lock.json "$LOCK_STAMP"
            fi

            echo "=== Generating Prisma client ==="
            npx prisma generate 2>&1 | tail -5

            echo "=== Writing .build-sha до build (для NEXT_PUBLIC_BUILD_ID) ==="
            echo "$GITHUB_SHA" > .build-sha
            echo "[setup] step 1 OK — следующий шаг билдит Next.js"

      - name: Deploy step 2/3 — build + verify
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          password: ${{ secrets.DEPLOY_SSH_PASS }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          envs: GITHUB_SHA
          timeout: 1200s
          # Билд = ~3 мин, fallback rebuild +3 мин, verify ~5 сек.
          # 20 мин запас — если билд реально упирается, увидим в логе.
          command_timeout: 20m
          script: |
            set -eo pipefail
            cd ${{ env.APP_DIR }}
            export GITHUB_SHA="${{ github.sha }}"

            echo "=== Запись .build-sha (на случай если step 1 не записал) ==="
            echo "$GITHUB_SHA" > .build-sha

            # Собираем в ОТДЕЛЬНЫЙ каталог: `.next` продолжает
            # обслуживать живой сайт, пока идёт сборка. Переключение —
            # в шаге 3, непосредственно перед рестартом.
            #
            # `distDir` уже читается из окружения (next.config.ts:
            # `process.env.NEXT_DIST_DIR || ".next"`), правок в
            # приложении не нужно.
            export NEXT_DIST_DIR=.next-build
            BUILD_DIR=.next-build

            echo "=== Restoring build cache (инкрементальная сборка) ==="
            # Без кеша Next собирает всё заново: 2.7 минуты вместо
            # примерно минуты. Кеш адресуется по содержимому — устаревшие
            # записи Next выбрасывает сам, поэтому перенос между сборками
            # безопасен и не даёт склеить старый код с новым.
            rm -rf "$BUILD_DIR"
            if [ -d .next.cache-backup ]; then
              mkdir -p "$BUILD_DIR"
              mv .next.cache-backup "$BUILD_DIR/cache"
              echo "[cache] восстановлен ($(du -sh "$BUILD_DIR/cache" | cut -f1))"
            else
              echo "[cache] бэкапа нет — сборка холодная"
            fi

            echo "=== Building Next.js on prod ==="
            # Build на том же хосте, где устанавливались node_modules,
            # чтобы пути внутри .next всегда резолвились в свежие пакеты.
            #
            # Stale .next/lock от прошлого упавшего build'а ломает все
            # следующие deploy'и: `next build` сразу выходит с «Unable to
            # acquire lock» и оставляет .next/server/app пустым, а
            # verify_manifests раньше (до strict-check) пропускал такое
            # как «зелёный» — пользователи видели «Что-то пошло не так»
            # на /root/organizations/[id], /mini и пр. Удаляем lock'и
            # перед каждой попыткой.
            rm -f "$BUILD_DIR/lock" 2>/dev/null || true
            # Запускаем build через `setsid` + nohup — он становится
            # process group leader, не наследует SSH-PTY и переживёт
            # любой SSH-SIGHUP/network-blip от GitHub-runner'а.
            #
            # Раньше build тупо зависал на «Creating an optimized
            # production build ...» — webpack вёл себя как зомби, не
            # выдавал output, не падал, не завершался. .build.log
            # оставался 611 байт. Похоже что запущенные webpack
            # workers ловили SIGHUP от parent SSH'а или просто блок'или
            # write() в pipe который кто-то не читал. setsid + полное
            # отвязывание от parent FDs устраняет.
            rm -f .build.log .build.done .build.failed 2>/dev/null || true
            setsid bash -c '
              npm run build > .build.log 2>&1
              echo "$?" > .build.exit
              if [ -s .build.exit ] && [ "$(cat .build.exit)" = "0" ]; then
                touch .build.done
              else
                touch .build.failed
              fi
            ' </dev/null >/dev/null 2>&1 &
            BUILD_PID=$!
            disown $BUILD_PID 2>/dev/null || true
            echo "[build] started PID=$BUILD_PID, polling for completion..."

            # Poll-loop — ждём появления .build.done или .build.failed.
            # Каждые 15с проверяем + печатаем прогресс. Timeout 18m =
            # 72 итерации (build реально занимает ~3 мин, всё что
            # больше = значит зависло).
            for i in $(seq 1 72); do
              sleep 15
              if [ -f .build.done ]; then
                echo "[build] завершился успешно после $((i*15)) сек"
                break
              fi
              if [ -f .build.failed ]; then
                echo "[build] FAILED после $((i*15)) сек — exit=$(cat .build.exit 2>/dev/null)"
                tail -50 .build.log
                exit 1
              fi
              # Прогресс: размер log + последние строки
              if [ -f .build.log ]; then
                LINES=$(wc -l < .build.log)
                echo "[build] poll #$i ($((i*15))s elapsed): $LINES log lines"
                # Каждые 4 итерации показываем хвост
                if [ $((i % 4)) -eq 0 ]; then
                  tail -3 .build.log | sed 's/^/  /'
                fi
              fi
            done
            if [ ! -f .build.done ] && [ ! -f .build.failed ]; then
              echo "[build] TIMEOUT после 18 мин — kill build PID=$BUILD_PID"
              kill -9 $BUILD_PID 2>/dev/null || true
              tail -50 .build.log
              exit 1
            fi
            tail -20 .build.log

            echo "=== Verifying client-reference manifests ==="
            # Next.js 16 периодически собирается «успешно», но без
            # client-reference-manifest.js файлов в $BUILD_DIR/server/app —
            # SSR HTML отдаётся, но React не может гидрировать (особенно
            # на мобильных, где нет кэша) и страницы выглядят рабочими
            # на ПК и сломанными на телефоне. Если такая ситуация —
            # ребилдим один раз с чистой папкой; если опять не помогло —
            # фейлим деплой явно, чтобы PM2 не подхватил битый build.
            #
            # Per-route check: для КАЖДОГО page.js должен лежать рядом
            # page_client-reference-manifest.js. Это ловит и случай
            # «manifest-ов мало вообще», и «manifest-ов много, но для
            # конкретного route отсутствует» — последний крашил
            # /root/organizations/[id], /mini и пр. с InvariantError.
            verify_manifests() {
              # Sanity: build вообще должен был сгенерировать $BUILD_DIR/server/app.
              # Если его нет — `find` молча вернёт пусто, и loop ниже отдаст
              # missing=0 → false-positive «всё ок». Проверяем явно.
              if [ ! -d "$BUILD_DIR/server/app" ]; then
                echo "[fail] $BUILD_DIR/server/app отсутствует — build не дошёл до compilation"
                return 1
              fi
              local pages
              pages=$(find "$BUILD_DIR/server/app" -name 'page.js' 2>/dev/null | wc -l)
              if [ "$pages" -lt "10" ]; then
                echo "[fail] всего $pages page.js — build явно неполный (ожидаем 80+)"
                return 1
              fi
              # Critical routes guard: явно перечисляем page.js которые
              # ОБЯЗАНЫ существовать. Раньше build мог "успешно" не
              # сгенерить /dashboard/page.js (Turbopack пропустил route
              # group без явной ошибки) — pm2 рестартовал на пустую
              # дыру, юзер видел 500 на главной странице. Теперь явно
              # прерываем deploy если хотя бы один critical route missing.
              local critical_missing=""
              for route in \
                "(dashboard)/dashboard/page.js" \
                "(auth)/login/page.js" \
                "(dashboard)/settings/page.js" \
                "(dashboard)/settings/onboarding/page.js" \
                "(dashboard)/journals/page.js" \
                "(dashboard)/journals/[code]/page.js" \
                "(dashboard)/journals/[code]/documents/[docId]/page.js" \
                "mini/page.tsx_NA" \
                ; do
                # `mini/page.tsx_NA` — намеренно невалидный, пропустим
                # mini для now (ещё не критичный для public). Остальные —
                # обязательные.
                [[ "$route" == *_NA ]] && continue
                if [ ! -f "$BUILD_DIR/server/app/$route" ]; then
                  critical_missing="$critical_missing $route"
                fi
              done
              if [ -n "$critical_missing" ]; then
                echo "[fail] критичные routes не собрались:"
                for r in $critical_missing; do echo "  - $BUILD_DIR/server/app/$r"; done
                return 1
              fi
              local missing=0
              local missing_list=""
              while IFS= read -r page_js; do
                [ -z "$page_js" ] && continue
                local dir
                dir=$(dirname "$page_js")
                if [ ! -f "$dir/page_client-reference-manifest.js" ]; then
                  missing=$((missing+1))
                  missing_list="$missing_list ${dir#$BUILD_DIR/server/app/}"
                fi
              done < <(find "$BUILD_DIR/server/app" -name 'page.js' 2>/dev/null)
              if [ "$missing" -gt "0" ]; then
                echo "[fail] $missing routes без client-reference-manifest:"
                for r in $missing_list; do echo "  - $r"; done
                return 1
              fi
              local total
              total=$(find "$BUILD_DIR/server/app" -name '*client-reference-manifest.js' 2>/dev/null | wc -l)
              echo "[ok] $pages page-routes (включая critical), все имеют manifest ($total файлов)"
              return 0
            }

            if ! verify_manifests; then
              echo "[warn] manifest check failed — rebuilding from clean .next"
              # Полный rm -rf — заодно убирает stale .next/lock который
              # мог остаться от первого build'а, упавшего на OOM.
              # Сносим только новую сборку — работающая не при чём.
              # Раньше здесь стоял `rm -rf .next`, и именно эта ветка
              # оставляла живой сайт вообще без статики.
              rm -rf "$BUILD_DIR"
              npm run build > .build-rebuild.log 2>&1 || REBUILD_FAIL=$?
              echo "[rebuild] $(wc -l < .build-rebuild.log) lines logged → .build-rebuild.log"
              tail -50 .build-rebuild.log
              if [ -n "$REBUILD_FAIL" ]; then
                echo "[fail] rebuild exited non-zero ($REBUILD_FAIL)"
                exit "$REBUILD_FAIL"
              fi
              if ! verify_manifests; then
                echo "[fail] manifests still bad after rebuild — aborting deploy"
                exit 1
              fi
            fi
            echo "=== Переносим старые chunks в новую сборку ==="
            # У человека, открывшего страницу ДО переключения, в HTML
            # стоят старые имена чанков. После переключения каталогов их
            # запросы пошли бы в новую сборку, где таких имён нет.
            # Имена содержат хеш, поэтому старые и новые спокойно лежат
            # рядом; `cp -n` не даёт перезаписать новые.
            #
            # Берём прямо из ЖИВОЙ сборки — она на месте, отдельный
            # бэкап больше не нужен.
            if [ -d .next/static ]; then
              for sub in chunks css media; do
                if [ -d ".next/static/$sub" ]; then
                  mkdir -p "$BUILD_DIR/static/$sub"
                  cp -rn ".next/static/$sub/." "$BUILD_DIR/static/$sub/" 2>/dev/null || true
                fi
              done
              echo "[chunks] старые файлы перенесены рядом с новыми"
            else
              echo "[chunks] живой сборки нет — первый деплой"
            fi

            echo "[build] step 2 OK — новая сборка готова в $BUILD_DIR"
            echo "[build] живой сайт всё это время работал со старой"

      - name: Deploy step 3/3 — db push + seeds + pm2 restart + prewarm
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          password: ${{ secrets.DEPLOY_SSH_PASS }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          envs: GITHUB_SHA
          timeout: 600s
          # Seeds (~2 мин) + test-bot-wizard (~2 мин) + pm2 restart +
          # prewarm (~1 мин) — итого ~5-6 мин, 15 мин запас.
          command_timeout: 15m
          script: |
            set -eo pipefail
            cd ${{ env.APP_DIR }}
            export GITHUB_SHA="${{ github.sha }}"

            echo "=== Pushing schema to DB ==="
            # prisma db push зависит от `dotenv/config` в prisma.config.ts.
            # В node_modules он есть, но иногда резолвер prisma его не
            # находит если запустить `npx` без предварительной подгрузки
            # env. Заранее экспортируем переменные из .env.
            if [ -f .env ]; then
              set -a; . ./.env; set +a
            fi
            # Статус берём у самого push, а не у tail: пайп возвращает
            # код последней команды, и упавший push проходил незамеченным.
            # Дальше на нём падали сиды (клиент ждёт колонок, которых нет),
            # и до перезапуска PM2 деплой не доходил — без внятной причины
            # в логе.
            # --accept-data-loss: удаление колонок (trialWrites*, aiMonthly* —
            # снятые лимиты бесплатного тарифа) без флага заставляет prisma
            # ждать интерактивного подтверждения, и деплой зависал бы.
            set -o pipefail
            if ! npx prisma db push --accept-data-loss 2>&1 | tail -15; then
              echo "[FATAL] prisma db push не применился — деплой остановлен"
              exit 1
            fi
            set +o pipefail

            echo "=== Seeding journal templates ==="
            if [ -f .env ]; then
              npx tsx prisma/seed.ts 2>&1 | tail -20
              echo "=== Seeding job positions (idempotent) ==="
              npx tsx prisma/seed-job-positions.ts 2>&1 | tail -5
              echo "=== Seeding journal fill modes + cleanup (idempotent) ==="
              npx tsx prisma/seed-journal-fill-modes.ts 2>&1 | tail -5
              echo "=== Seeding blog articles (idempotent) ==="
              npx tsx prisma/seed-articles.ts 2>&1 | tail -5
              echo "=== Running bot wizard tests ==="
              npx tsx scripts/test-bot-wizard.ts 2>&1 | tail -40 || echo "[warn] bot wizard tests failed — deploy continues"
              echo "=== Seeding demo-screenshots org (idempotent) ==="
              npx tsx prisma/seed-demo-screenshots.ts 2>&1 | tail -5
              echo "=== Seeding production calendar RU (idempotent) ==="
              npx tsx prisma/seed-production-calendar.ts 2>&1 | tail -5
              echo "=== Mirroring Rooms → Areas (idempotent backfill) ==="
              npx tsx prisma/seed-mirror-rooms-to-areas.ts 2>&1 | tail -5
              echo "=== Cleanup default-positions (one-shot for orgs that got 18 defaults from old seed) ==="
              npx tsx prisma/seed-cleanup-default-positions.ts 2>&1 | tail -5
              echo "=== Rename climate_control title to «… на складах» (idempotent) ==="
              npx tsx prisma/seed-rename-climate-title.ts 2>&1 | tail -5
              echo "=== Rename hygiene title to «Гигиенический журнал (сотрудники)» (idempotent) ==="
              npx tsx prisma/seed-rename-hygiene-title.ts 2>&1 | tail -5
              echo "=== Disable broken TF integrations (idempotent — disable rows whose key can't decrypt) ==="
              npx tsx scripts/disable-broken-tf-integrations.ts 2>&1 | tail -10
              echo "=== Cleaning unification: backfill scope/days from JournalDocument.config.rooms[] → Room ==="
              npx tsx prisma/seed-cleaning-unification.ts 2>&1 | tail -10
              echo "=== Журнал здоровья: выключаем у организаций, которые его не ведут (one-shot, PlatformSetting-guard) ==="
              npx tsx prisma/seed-disable-health-check.ts 2>&1 | tail -10 || echo "[warn] seed-disable-health-check failed — deploy continues"
              echo "=== Шапка «УТВЕРЖДАЮ»: должность и ФИО одного человека + помещения в пустых графиках ген. уборок (one-shot, PlatformSetting-guard) ==="
              npx tsx prisma/seed-fix-approver-mismatch.ts --dry-run 2>&1 | tail -40 || echo "[warn] seed-fix-approver-mismatch dry-run failed"
              npx tsx prisma/seed-fix-approver-mismatch.ts 2>&1 | tail -40 || echo "[warn] seed-fix-approver-mismatch failed — deploy continues"
            else
              echo ".env not found, skip seed"
            fi

            echo "=== Переключение на новую сборку ==="
            # Момент истины и единственное место, где живой сайт вообще
            # меняется. До этой строки он работал со старой сборкой всё
            # время: распаковку, npm ci, сборку и проверку манифестов.
            #
            # Два переименования каталогов — это миллисекунды, и сразу за
            # ними идёт рестарт. Раньше на этом месте были минуты: сборка
            # шла ПОВЕРХ работающего каталога, и всё это время JS отдавал
            # 500. Поймано вживую 2026-09-09 на /journals.
            #
            # Если сборка не удалась, сюда мы не дойдём — шаг 2 упадёт
            # раньше, и сайт останется на прежней версии.
            if [ ! -d .next-build ]; then
              echo "[swap] .next-build отсутствует — шаг 2 не подготовил сборку"
              exit 1
            fi
            rm -rf .next-previous
            # Не `[ -d .next ] && mv …`: при `set -e` ложное условие
            # уронило бы весь шаг на первом деплое, когда каталога ещё
            # нет.
            if [ -d .next ]; then
              mv .next .next-previous
            fi
            mv .next-build .next
            echo "[swap] переключено на новую сборку"

            echo "=== Restarting PM2 (web + telegram poller) ==="
            npx pm2 delete haccp-online 2>/dev/null || true
            # next start по умолчанию слушает :3000, но nginx проксирует
            # на :3002 — явно указываем порт, иначе процесс падает
            # с EADDRINUSE когда на 3000 висит другое приложение.
            npx pm2 start "npx next start -p 3002" --name haccp-online --cwd "$(pwd)" --update-env 2>&1 | tail -5

            # Long-polling daemon для Telegram — webhook у прод-nginx
            # уходит на dead upstream в ~50% случаев (пользователи видят
            # 503 Tunnel Unavailable), править nginx без sudo нельзя,
            # так что ходим за апдейтами сами через прямой коннект к
            # api.telegram.org (с TELEGRAM_FORCE_IP). Grammy автоматом
            # снимет webhook при bot.start(), так что оба канала не
            # конкурируют.
            npx pm2 delete haccp-telegram-poller 2>/dev/null || true
            npx pm2 start "npx tsx scripts/telegram-poller.ts" --name haccp-telegram-poller --cwd "$(pwd)" --update-env 2>&1 | tail -5

            npx pm2 save --force 2>&1 | tail -2
            npx pm2 status --no-color | grep -E 'haccp|name|---' || true

            # Pre-warm основных публичных routes. Next.js 16 Turbopack
            # JIT-компилирует client reference manifest при первом hit'е
            # — пока он не построен, первые ~30-90 секунд после restart'а
            # пользователи получают 500 + «Invariant: client reference
            # manifest does not exist» в логах. Curl'ем сами разогреваем
            # popular страницы, public traffic идёт уже на готовое.
            echo "=== Pre-warming routes ==="
            # 10s sleep — pm2 нужно полностью встать. Если делать
            # запрос раньше — curl получает connection-reset.
            sleep 10
            # Покрываем И публичные routes (для landing-traffic), И приватные
            # (для logged-in management/staff). Приватные redirect'ятся
            # на /login (307), но это после того как `page.tsx` успел
            # загрузиться — что и компилирует client reference manifest.
            # Иначе на первый auth-request пользователи видят
            # «Invariant: client reference manifest does not exist» и
            # 500 в браузере (особенно заметно на мобильных, где они
            # часто открывают /journals/[code] первым делом).
            #
            # Дефолтный slug для динамических routes — `cleaning`
            # (стабильный templateCode из ACTIVE_JOURNAL_CATALOG).
            # Для documents-route — `_warm` (fake doc-id, страница
            # вернёт 404 но manifest скомпилируется).
            # Последний путь `/__deploy-warm-404` — нарочно несуществующий,
            # триггерит компиляцию `/_not-found` route (без него
            # InvariantError для всех битых ссылок).
            if ! bash scripts/prewarm-routes.sh 2>&1; then
              echo "[prewarm] script failed — non-fatal, продолжаем"
            fi

            echo "=== Уборка предыдущей сборки ==="
            # Держали её до этого момента на случай, если рестарт или
            # прогрев упадут и придётся возвращаться руками.
            rm -rf .next-previous 2>/dev/null || true

            echo "=== Deploy complete ==="

      # Деплой падал по несколько раз в день (typecheck-гейт), а узнавали
      # об этом случайно — прод оставался на старом коде. Шаг ниже
      # срабатывает ТОЛЬКО при падении любого предыдущего шага и шлёт
      # админу платформы сообщение в Telegram с коммитом и ссылкой на лог.
      # Секреты: TELEGRAM_BOT_TOKEN (тот же бот @wesetupbot) и
      # DEPLOY_ALERT_TELEGRAM_CHAT_ID (= PLATFORM_ADMIN_TELEGRAM_CHAT_ID с прода).
      # Если секретов нет — шаг молча пропускается, деплой это не ломает.
      - name: Notify Telegram on failure
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.DEPLOY_ALERT_TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "[notify] секреты не заданы — пропуск"
            exit 0
          fi
          FIRST_LINE=$(printf '%s' "$COMMIT_MSG" | head -n1 | cut -c1-120)
          TEXT=$(printf '❌ Деплой wesetup.ru упал\nКоммит %s: %s\nПрод остался на предыдущей версии.\nЛог: %s' "${SHORT_SHA:0:8}" "$FIRST_LINE" "$RUN_URL")
          curl -sS --max-time 20 -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true" \
            -o /dev/null -w "[notify] telegram HTTP %{http_code}\n" || echo "[notify] не отправилось — non-fatal"
