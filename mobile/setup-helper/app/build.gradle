plugins {
    id 'com.android.application'
}

// Версия приложения. Номер сборки (versionCode) растёт с каждым выпуском:
// по нему приложение на телефоне понимает, что на сайте есть новее.
def appVersionName = '1.2.0'
def appVersionCode = project.hasProperty('versionCode') ? project.property('versionCode').toString().toInteger() : 4

// Сертификат, которым подписаны все выпуски. Android ставит обновление
// поверх, только если ключ тот же, — publishRelease проверяет это до выкладки.
// С 1.2.0 (26.10.2026) — новый ключ: прежний (e67c22a2…) потерян, телефоны
// с 1.0/1.1 один раз переставляют приложение вручную. Ключ — в секретах
// GitHub (SETUP_HELPER_KEYSTORE_BASE64 и пароли), выпуск собирает CI.
def releaseCertSha256 = '20b6bd349e4699bddb23ef0f81cf3a612607d3b8190813ba6403215641dfecb4'

// Ключ подписи — из переменных окружения: репозиторий публичный, ключу в git
// не место. SETUP_HELPER_KEYSTORE — путь к файлу, SETUP_HELPER_KEYSTORE_BASE64 —
// сам файл в base64 (удобно для секретов окружения). Без ключа release
// подписывается отладочным ключом машины: для проверки хватает, но выложить
// такую сборку нельзя (см. README).
def releaseKeystore = System.getenv('SETUP_HELPER_KEYSTORE')
def releaseKeystoreBase64 = System.getenv('SETUP_HELPER_KEYSTORE_BASE64')
if (!releaseKeystore && releaseKeystoreBase64) {
    def decoded = layout.buildDirectory.file('signing/release.jks').get().asFile
    decoded.parentFile.mkdirs()
    decoded.bytes = releaseKeystoreBase64.trim().decodeBase64()
    releaseKeystore = decoded.path
}

android {
    namespace = 'ru.wesetup.helper'
    compileSdk = 36

    defaultConfig {
        applicationId = 'ru.wesetup.helper'
        minSdk = 24
        targetSdk = 36
        versionCode = appVersionCode
        versionName = appVersionName
        buildConfigField 'String', 'DEFAULT_SERVER', '"https://wesetup.ru"'
    }

    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile = file(releaseKeystore)
                storePassword = System.getenv('SETUP_HELPER_KEYSTORE_PASSWORD')
                keyAlias = System.getenv('SETUP_HELPER_KEY_ALIAS')
                keyPassword = System.getenv('SETUP_HELPER_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig = releaseKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
        // Robolectric: экраны создаются на JVM с настоящими ресурсами и Canvas.
        unitTests.includeAndroidResources = true
        unitTests.all {
            // Android 16 в Robolectric лезет во внутренности JDK 17+.
            jvmArgs '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED',
                    '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED'
        }
    }
}

dependencies {
    implementation project(':core')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.17.0'
    implementation 'com.google.android.material:material:1.13.0'

    testImplementation 'junit:junit:4.13.2'
    // org.json из Android в unit-тестах на JVM — заглушка; настоящая реализация.
    testImplementation 'org.json:json:20250517'
    testImplementation 'org.robolectric:robolectric:4.17'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:deprecation']
}

// Выпуск новой версии: собрать подписанный APK, убедиться, что подпись та же,
// что у прежних выпусков, и положить APK с version.json в resources/setup-helper
// сайта. После деплоя приложения на телефонах увидят версию и обновятся сами.
tasks.register('publishRelease') {
    group = 'publishing'
    description = 'Подписанный APK и version.json — в resources/setup-helper сайта'
    dependsOn 'assembleRelease'
    doLast {
        if (!releaseKeystore) {
            throw new GradleException('Нет ключа подписи (SETUP_HELPER_KEYSTORE или SETUP_HELPER_KEYSTORE_BASE64): '
                    + 'сборку с другим ключом телефоны не смогут поставить поверх')
        }
        def apk = layout.buildDirectory.file('outputs/apk/release/app-release.apk').get().asFile
        def apksigner = new File(android.sdkDirectory, "build-tools/${android.buildToolsVersion}/apksigner")
        def process = [apksigner.path, 'verify', '--print-certs', apk.path].execute()
        def output = process.text
        if (process.waitFor() != 0) throw new GradleException("APK не прошёл проверку подписи:\n${output}")
        def digest = (output =~ /certificate SHA-256 digest: ([0-9a-f]{64})/)
        if (!digest.find() || digest.group(1) != releaseCertSha256) {
            throw new GradleException("APK подписан не тем ключом: ожидался сертификат ${releaseCertSha256}")
        }

        def target = new File(rootDir, '../../resources/setup-helper')
        def manifestFile = new File(target, 'version.json')
        if (manifestFile.exists()) {
            def previous = new groovy.json.JsonSlurper().parse(manifestFile)
            if ((previous.versionCode as int) >= appVersionCode) {
                throw new GradleException("Номер сборки ${appVersionCode} не больше выложенного ${previous.versionCode}: "
                        + 'поднимите appVersionCode, иначе телефоны не увидят обновление')
            }
        }
        target.mkdirs()
        def published = new File(target, 'setup-helper.apk')
        published.bytes = apk.bytes
        def sha256 = java.security.MessageDigest.getInstance('SHA-256').digest(published.bytes).encodeHex().toString()
        def notesFile = file('release-notes.txt')
        def manifest = [
                versionCode: appVersionCode,
                versionName: appVersionName,
                sha256     : sha256,
                size       : published.length(),
                publishedAt: new Date().format('yyyy-MM-dd', TimeZone.getTimeZone('UTC')),
                notes      : notesFile.exists() ? notesFile.getText('UTF-8').trim() : '',
        ]
        def json = new groovy.json.JsonGenerator.Options().disableUnicodeEscaping().build()
        manifestFile.setText('{\n' + manifest.collect { key, value -> "  \"${key}\": ${json.toJson(value)}" }.join(',\n')
                + '\n}\n', 'UTF-8')
        logger.lifecycle("Выложено: ${published} (${appVersionName}, сборка ${appVersionCode}, sha256 ${sha256})")
    }
}
